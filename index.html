<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leben in Deutschland Test: Deutsch, English, বাংলা</title>
  <meta name="description" content="Free practice for the German citizenship and naturalisation test (Leben in Deutschland, Einbürgerungstest). All 300 general and 160 state questions in German, English and Bangla.">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="app.css">
  <script>
    // Apply the saved theme before first paint.
    try { var t = localStorage.getItem('lid.theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" id="brand">Leben in Deutschland</a>
    <div class="top-tools">
      <div class="seg" id="uiLang" role="group" aria-label="Interface language">
        <button data-ui="de">DE</button><button data-ui="en">EN</button><button data-ui="bn">বাং</button>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Theme" title="Theme">◐</button>
    </div>
  </header>

  <main id="app" aria-live="polite"><p class="loading">Loading…</p></main>

  <footer class="foot" id="foot"></footer>
  <script src="app.js"></script>
</body>
</html>
